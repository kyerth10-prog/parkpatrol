# Render Blueprint: https://render.com/docs/blueprint-spec
# The camera client (scripts/send_frame.py) keeps running on the laptop and
# sends frames to this service's public URL.
services:
  - type: web
    name: parkpatrol
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TZ
        value: Asia/Manila
      - key: SESSION_SECRET
        generateValue: true
      # Values below are entered in the Render dashboard (never committed)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: TRACKER_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Hosted MySQL (Aiven)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: parkpatrol
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA
        sync: false
