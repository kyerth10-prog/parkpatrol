<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#fff;color:#111814;font-family:Geist,sans-serif}
.top{height:64px;display:flex;align-items:center;padding:0 56px;gap:36px;border-bottom:1px solid #eceeed}.logo{font-weight:600}.nav{display:flex;gap:24px;font-size:14px;color:#5b6660}
.wrap{padding:56px}.sign{display:flex;align-items:center;gap:48px;border:1px solid #e5e7eb;border-radius:20px;padding:40px 48px}
.dig{font:600 140px Geist;letter-spacing:-.05em;color:#16a34a;line-height:1}.lab{font:500 13px "Geist Mono";letter-spacing:.12em;color:#5b6660}

.cta{margin-left:auto;display:flex;flex-direction:column;gap:10px}.p{background:#16a34a;color:#fff;padding:14px 22px;border-radius:10px;font-weight:500;text-align:center}.s{border:1px solid #e5e7eb;padding:14px 22px;border-radius:10px;text-align:center}
.lights{margin-top:40px;display:grid;grid-template-columns:repeat(18,1fr);gap:10px}
.lt{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 0;border:1px solid #eceeed;border-radius:12px}.lt i{width:22px;height:22px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 6px #dcfce7}.lt.t i{background:#d1d5db;box-shadow:0 0 0 6px #f3f4f6}.lt b{font:500 13px "Geist Mono"}
.row{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-top:32px}.card{border:1px solid #eceeed;border-radius:16px;height:300px;padding:24px}.card h3{font-size:16px;font-weight:600}
</style></head><body>
