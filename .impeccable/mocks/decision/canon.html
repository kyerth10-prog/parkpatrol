<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#f8fafc;color:#0f172a;font-family:Inter,sans-serif;display:grid;grid-template-columns:248px 1fr}
.side{background:#fff;border-right:1px solid #e2e8f0;padding:24px 16px}.side b{display:block;margin-bottom:28px}.side p{padding:10px 12px;border-radius:8px;font-size:14px;color:#475569}.side p.a{background:#f0fdf4;color:#15803d;font-weight:500}
.main{padding:32px}h1{font-size:24px;font-weight:600;margin-bottom:24px}.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.c{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px}.c span{font-size:13px;color:#64748b}.c b{display:block;font-size:30px;margin-top:6px}
.g{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}.big{height:560px}
</style></head><body><aside class="side"><b>Park Patrol</b><p class="a">Dashboard</p><p>Live camera</p><p>Lot map</p><p>Violations</p><p>Activity</p></aside>
<div class="main"><h1>Dashboard</h1><div class="kp"><div class="c"><span>Available</span><b>11</b></div><div class="c"><span>Occupied</span><b>6</b></div><div class="c"><span>Violations</span><b>1</b></div><div class="c"><span>Occupancy</span><b>39%</b></div></div>
<div class="g"><div class="c big"><span>Live camera</span></div><div class="c big"><span>Lot layout</span></div></div></div></body></html>
