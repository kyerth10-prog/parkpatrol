<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>{{title}} · Park Patrol</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/ui.css?v=12">
</head>
<body class="guest">
  <main class="error-page">
    <a class="brand" href="/" aria-label="Park Patrol home">
      <svg class="brand__mark" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#0f1712"/><path d="M10.5 20V8.5h4.25a3.75 3.75 0 0 1 0 7.5H10.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20.5" cy="20.5" r="3" fill="#3fcf73"/></svg>
      <span class="brand__text"><b>Park Patrol</b><small>De La Salle Lipa</small></span>
    </a>
    <h1>{{title}}</h1>
    <p>{{message}}</p>
    <div class="error-page__actions">
      <a class="btn btn--primary" href="/">Back to the lot</a>
      {{signin}}
    </div>
  </main>
</body>
</html>
